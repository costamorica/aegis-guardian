name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check scripts
        run: |
          shellcheck \
            bin/aegis-guardian \
            install.sh \
            update.sh \
            uninstall.sh \
            lib/*.sh \
            modules/*.sh \
            tests/*.sh
